<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Team contribution details for Task Manager.">
  <title>Team Contribution</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Task Manager</p>
        <h1>Team Contribution</h1>
      </div>
    </header>

    <section class="panel" aria-labelledby="contribution-heading">
      <h2 id="contribution-heading">Contributor</h2>
      <button id="load-contributor" class="button button-primary" type="button">Show Contributor</button>
      <p id="contributor-student-id" class="status-message" role="status" aria-live="polite"></p>
      <a class="text-link" href="index.html">Back to Task Manager</a>
    </section>
  </main>

  <script>
    const loadButton = document.getElementById("load-contributor");
    const studentIdElement = document.getElementById("contributor-student-id");

    loadButton.addEventListener("click", async () => {
      loadButton.disabled = true;
      studentIdElement.textContent = "Loading contributor...";

      try {
        const response = await fetch("contribution.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`Request failed (${response.status}).`);

        const contributor = await response.json();
        if (!contributor.contributorStudentId) {
          throw new Error("Contributor student ID was not found.");
        }

        studentIdElement.textContent = `Contributor Student ID: ${contributor.contributorStudentId}`;
      } catch (error) {
        studentIdElement.textContent = error.message || "Could not load contributor information.";
      } finally {
        loadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
